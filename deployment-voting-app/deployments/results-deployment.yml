apiVersion: apps/v1
kind: Deployment
metadata:
  name: results
  labels:
    app: results
spec:
  replicas: 1
  template:
    metadata:
      name: result
      labels:
        app: result
        tier: frontend
    spec:
      containers:
        - name: result
          image: dockersamples/examplevotingapp_result
          ports:
            - containerPort: 80
              name: result
  selector:
    matchLabels:
      app: result
