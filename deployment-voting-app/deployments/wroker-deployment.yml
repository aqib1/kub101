apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
    tier: backend
spec:
  template:
    metadata:
      name: worker
      labels:
        app: worker
        tier: backend
    spec:
      containers:
        - name: worker
          image: dockersamples/examplevotingapp_worker
  replicas: 1
  selector:
    matchLabels:
      app: worker
