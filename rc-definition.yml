apiVersion: v1
kind: ReplicationController
metadata:
  name: myapp-rc
  labels:
    app: myapp
    type: event-driven

spec:
  template:
    metadata: 
      name: testapp-pod
      labels:
        app: testapp
        type: back-end

    spec:
      containers:
        - name: nginx-container
          image: nginx
  replicas: 3