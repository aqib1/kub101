apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myapp-replica-set
  labels:
    app: myapp
    type: event-driven

spec:
  template:
    metadata: 
      name: testapp-pod
      labels:
        app: testapp
        type: back-end
    spec:
      containers:
        - name: nginx-container
          image: nginx
  replicas: 3
  selector:
    matchLabels:
        app: testapp

