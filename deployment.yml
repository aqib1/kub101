apiVersion: apps/v1
kind: Deployment
metadata:
  name: okyc-agent-deployment
  labels:
    app: okyc-service
    tier: backend
spec:
  template:
    metadata:
      name: nginx-2
      labels:
        app: nginxApp
        tier: networking
    spec:
      containers:
        - name: nginx
          image: "nginx"
  replicas: 4
  selector: 
    matchLabels:
      app: nginxApp
